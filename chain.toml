# Registry kontrak Robinhood Chain.
#
# Berkas ini adalah SUMBER TUNGGAL alamat kontrak. Dibaca oleh engine saat
# start (gate G1 di PRD 6.4) dan oleh `cargo xtask verify`. Jangan pernah
# menulis ulang alamat di tempat lain dalam kode.
#
# Kolom `code_hash` adalah keccak256 dari bytecode yang terpasang, diisi oleh
# `cargo xtask verify --pin`. Kosong berarti belum pernah dipin, dan engine
# akan memperingatkan tapi tetap jalan. Setelah dipin, selisih apa pun membuat
# engine menolak start, karena artinya kontrak di alamat itu bukan yang kita
# harapkan.
#
# Cara memverifikasi ulang dari nol ada di docs/CHAIN.md.

[chain]
name = "Robinhood Chain"
id = 4663
kind = "Arbitrum Orbit L2"
gas_token = "ETH"
explorer = "https://robinhoodchain.blockscout.com"
block_time_ms = 100
# Blok saat protokol dipasang. Batas bawah pemindaian log Initialize V4.
deploy_block = 7887312

[tokens]
weth = { address = "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73", decimals = 18, note = "aeWETH proxy, kompatibel WETH9" }
# Stablecoin chain ini. Banyak memecoin justru berpasangan dengan ini, bukan
# WETH. Ditemukan dari pemindaian log Initialize pada FIG, 33 dari 39 poolnya
# memakai USDG.
usdg = { address = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168", decimals = 6, note = "stablecoin, pasangan paling umum untuk memecoin" }

