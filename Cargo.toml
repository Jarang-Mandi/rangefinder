[workspace]
members = ["engine", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Profil rilis dioptimalkan untuk latensi, bukan ukuran biner.
# Alasan ada di docs/DECISIONS.md entri 0006.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
