[package]
name = "rangefinder-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Engine lokal Rangefinder: server 127.0.0.1, keystore, akses Robinhood Chain"

[lib]
name = "rangefinder_engine"
path = "src/lib.rs"

[[bin]]
name = "rangefinder"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower = "0.5.3"
redb = "4.2.0"
aes-gcm = "0.11.1"
argon2 = "0.6.0"
rand = "0.10.2"
zeroize = { version = "1.9.0", features = ["derive"] }
hex = "0.4.3"
subtle = "2.6.1"
dirs = "6.0.0"
alloy = { version = "2.1.1", default-features = false, features = ["std", "provider-http", "provider-ws-native-tls", "reqwest-native-tls", "signer-local", "contract", "sol-types", "rpc-types-eth", "json-rpc", "k256", "serde", "json"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
futures-util = "0.3.34"
toml = "1.1.5"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
